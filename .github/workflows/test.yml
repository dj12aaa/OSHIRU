name: OSHIRU Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check api/_core.mjs
          node --check api/search.js
          node --check api/suggest.js
      - name: Unit and public safety tests
        run: npm test
