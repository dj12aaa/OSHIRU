name: OSHIRU Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check contact.js
          node --check api/_core.mjs
          node --check api/search.js
          node --check api/suggest.js
          node --check api/contact-email.js
      - name: Unit and public safety tests
        run: npm test
      - name: Wait for Vercel production and smoke test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://oshiruoshi.vercel.app'
          HTML=''
          echo 'Waiting for the production deployment that contains this commit...'
          for i in $(seq 1 24); do
            HTML=$(curl -fsS --max-time 10 "$BASE/" || true)
            if printf '%s' "$HTML" | grep -Fq '確認済みの個別出品を価格・送料・販売元ごとに比較'; then
              echo "Production updated on attempt $i"
              break
            fi
            sleep 5
          done
          printf '%s' "$HTML" | grep -Fq '確認済みの個別出品を価格・送料・販売元ごとに比較'
          if printf '%s' "$HTML" | grep -Fq '通販API'; then
            echo 'Old commerce API UI is still present'
            exit 1
          fi
          SEARCH=$(curl -fsS --max-time 10 "$BASE/api/search?q=%E6%9D%B1%E9%9B%B2%E7%B5%B5%E5%90%8D%206c")
          printf '%s' "$SEARCH" | grep -Fq 'm42733344317'
          printf '%s' "$SEARCH" | grep -Fq '2666'
          SUGGEST=$(curl -fsS --max-time 10 "$BASE/api/suggest?q=%E4%BA%94%E6%9D%A1%E6%82%9F")
          printf '%s' "$SUGGEST" | grep -Fq '五条悟'
          HEADERS=$(curl -fsSI --max-time 10 "$BASE/")
          printf '%s' "$HEADERS" | grep -Fiq 'content-security-policy:'
          printf '%s' "$HEADERS" | grep -Fiq 'strict-transport-security:'
          echo 'Production smoke test passed.'
