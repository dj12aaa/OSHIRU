name: OSHIRU Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check contact.js
          node --check api/_core.mjs
          node --check api/search.js
          node --check api/suggest.js
          node --check api/contact-email.js
          node --check api/closed.js
      - name: Unit and public safety tests
        run: npm test
      - name: Verify production is closed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://oshiruoshi.vercel.app'
          CODE=''
          echo 'Waiting for closed production deployment...'
          for i in $(seq 1 24); do
            CODE=$(curl -sS -o /tmp/oshiru-body --max-time 10 -w '%{http_code}' "$BASE/" || true)
            if [ "$CODE" = '503' ] && grep -Fq '現在、一般公開を停止しています。' /tmp/oshiru-body; then
              echo "Closed production deployed on attempt $i"
              break
            fi
            sleep 5
          done
          test "$CODE" = '503'
          grep -Fq '現在、一般公開を停止しています。' /tmp/oshiru-body
          API_CODE=$(curl -sS -o /tmp/oshiru-api --max-time 10 -w '%{http_code}' "$BASE/api/search?q=test" || true)
          test "$API_CODE" = '503'
          HEADERS=$(curl -sSI --max-time 10 "$BASE/" || true)
          printf '%s' "$HEADERS" | grep -Fiq 'x-robots-tag: noindex'
          printf '%s' "$HEADERS" | grep -Fiq 'cache-control: no-store'
          echo 'Production is not publicly usable.'
